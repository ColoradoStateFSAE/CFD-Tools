name: Nightly Development Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  SRC_DIR: CFD-Automation-Suite-Source-Code

jobs:
  # =========================================================================
  # JOB 1: Build the app with PyInstaller, then wrap it in an NSIS installer
  #
  #   PyInstaller produces dist/RamRacingCFD/ — a self-contained bundle
  #   containing the exe, the Python runtime, PyQt6, and PyFluent.
  #   NSIS then packages that folder into RamRacingCFD-Setup.exe.
  #
  #   Running NSIS WITHOUT PyInstaller first produces an installer that
  #   only contains .py source files and cannot run. That was the old bug.
  # =========================================================================
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: ${{ env.SRC_DIR }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 --only-binary=:all:
          pip install ansys-fluent-core
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      # ── Fail fast if the source itself is broken ─────────────────────────
      - name: Verify imports
        run: |
          python -c "import PyQt6.QtWidgets;          print('PyQt6 OK')"
          python -c "import ansys.fluent.core;        print('PyFluent OK')"
          python -c "import simtypes.configs;         print('Configs OK')"
          python -c "import core.runner;              print('Runner OK')"
          python -c "import core.queue_manager;       print('Queue OK')"
          python -c "import utils.results_exporter;   print('Exporter OK')"

      # ── Build the self-contained application ─────────────────────────────
      - name: Build application with PyInstaller
        run: |
          pyinstaller --clean --noconfirm RamRacingCFD.spec

          if (-not (Test-Path "dist\RamRacingCFD\RamRacingCFD.exe")) {
            Write-Error "PyInstaller did not produce RamRacingCFD.exe"
            exit 1
          }

          $bundle = Get-ChildItem -Recurse "dist\RamRacingCFD" |
                    Measure-Object -Property Length -Sum
          $mb = [math]::Round($bundle.Sum / 1MB, 1)

          Write-Output "Bundle: $($bundle.Count) files, $mb MB"

          # A real bundle with Python + Qt + PyFluent is >50 MB.
          # Anything smaller means dependencies were not collected.
          if ($mb -lt 30) {
            Write-Error "Bundle is only $mb MB — dependencies were not bundled"
            exit 1
          }

      # ── Wrap the bundle in an installer ──────────────────────────────────
      - name: Install NSIS Compiler Engine
        uses: negrutiu/nsis-install@v2

      - name: Compile Windows Installer via NSIS
        run: |
          makensis installer.nsi

          if (-not (Test-Path "RamRacingCFD-Setup.exe")) {
            Write-Error "NSIS did not produce RamRacingCFD-Setup.exe"
            exit 1
          }

          $setupMb = [math]::Round((Get-Item "RamRacingCFD-Setup.exe").Length / 1MB, 1)
          Write-Output "Installer: $setupMb MB"

          # The installer must be large enough to contain the bundle.
          if ($setupMb -lt 20) {
            Write-Error "Installer is only $setupMb MB — it does not contain the app bundle"
            exit 1
          }

      # ── Stage both deliverables with date + commit metadata ──────────────
      - name: Stage artifacts with date and commit hash
        shell: powershell
        run: |
          $date = Get-Date -Format "yyyyMMdd"
          $sha  = (git rev-parse --short HEAD).Trim()

          New-Item -ItemType Directory -Force -Path "..\dist-staged" | Out-Null

          Move-Item "RamRacingCFD-Setup.exe" `
                    "..\dist-staged\RamRacingCFD-setup-$date-$sha.exe" -Force

          Compress-Archive -Path "dist\RamRacingCFD\*" `
                           -DestinationPath "..\dist-staged\RamRacingCFD-portable-$date-$sha.zip"

          Get-ChildItem "..\dist-staged" |
            Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - name: Archive Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-windows-build
          path: dist-staged/*
          retention-days: 1

  # =========================================================================
  # JOB 2: Delete Old Release, Then Publish Fresh One
  # =========================================================================
  publish-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-windows]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Generate build metadata tags
        id: metadata
        shell: bash
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-windows-build
          path: dist-assets

      - name: Package application source archive
        shell: bash
        run: |
          mkdir -p dist-assets
          tar --exclude='.git' --exclude='.github' --exclude='dist-assets' \
            -czf dist-assets/app-nightly-${{ steps.metadata.outputs.BUILD_DATE }}-${{ steps.metadata.outputs.COMMIT_SHA }}.tar.gz .

      - name: List release assets
        run: ls -lh dist-assets/

      # Deletes the release AND its tag so nothing old lingers.
      # The `gh` CLI is pre-installed on all GitHub-hosted runners.
      # The `|| true` prevents the step from failing if no prior release exists yet.
      - name: Delete existing nightly release and tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly-latest --yes --cleanup-tag || true

      # Small pause to let GitHub's backend fully propagate the deletion
      # before we immediately recreate the same tag name.
      - name: Wait for deletion to propagate
        run: sleep 5

      - name: Publish fresh nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-latest
          name: "Nightly Development Build"
          body: |
            ### 🌙 Nightly Development Build
            This release contains the absolute latest, automatically compiled features directly from the `main` branch.

            ⚠️ **Please Note:** These builds are developmental works-in-progress and may contain bugs or unstable features.

            **Downloads**
            | File | Use |
            |------|-----|
            | `RamRacingCFD-setup-*.exe` | Full installer — adds Start Menu entry, sets `AWP_ROOT261` |
            | `RamRacingCFD-portable-*.zip` | Portable — unzip anywhere, run `RamRacingCFD.exe` |
            | `app-nightly-*.tar.gz` | Source archive |

            Python is **not** required — the runtime and all dependencies are bundled.
            Ansys Fluent 2026 R1 (v261) must be installed and licensed separately.

            * **Build Date:** ${{ steps.metadata.outputs.BUILD_DATE }}
            * **Latest Commit:** ${{ steps.metadata.outputs.COMMIT_SHA }}
          prerelease: true
          files: |
            dist-assets/*.tar.gz
            dist-assets/*.exe
            dist-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
