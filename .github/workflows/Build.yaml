name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --name RamRacingCFD --windowed --onedir main.py `
            --collect-all PyQt6 `
            --add-data "utils\Wheel_MRF_Setup_Guide.pdf;utils"
          # --add-data copies the PDF into dist\RamRacingCFD\utils\
          # so $INSTDIR\utils\Wheel_MRF_Setup_Guide.pdf exists after install

      - name: Verify expected assets exist
        run: |
          if (!(Test-Path "assets\logo.ico")) { throw "Missing assets\logo.ico" }
          if (!(Test-Path "Documentation\LICENSE.txt")) { throw "Missing Documentation\LICENSE.txt" }
          if (!(Test-Path "dist\RamRacingCFD\utils\Wheel_MRF_Setup_Guide.pdf")) { throw "PDF not bundled into dist" }

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer with makensis
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RamRacingCFD-Setup
          path: installer\RamRacingCFD-Setup.exe

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\RamRacingCFD-Setup.exe
