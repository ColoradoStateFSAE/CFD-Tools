name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --name CFDAutomationSuite --windowed --onedir main.py
          # --onedir is usually better for NSIS packaging than --onefile

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer with makensis
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFDAutomationSuite-Setup
          path: installer\CFDAutomationSuite-Setup.exe

      # Optional: attach to a GitHub Release when triggered by a tag push
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\CFDAutomationSuite-Setup.exe
